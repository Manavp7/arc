[project]
name = "sio-decision"
version = "0.1.0"
description = "SIO decisions: OR-Tools optimisation with ranked, inspectable options (PRD M12)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "sio-core",
    "sio-schemas",
    "ortools>=9.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_decision"]

[tool.uv.sources]
sio-core = { workspace = true }
sio-schemas = { workspace = true }
