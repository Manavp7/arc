[project]
name = "sio-tracking"
version = "0.1.0"
description = "SIO tracking engine: ByteTrack, geo tracking, cross-camera association (PRD M4)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "sio-core",
    "sio-schemas",
    "numpy>=2.0",
]

[project.optional-dependencies]
# BoxMOT remains available as a drop-in alternative; it is optional because its install path
# pulls in PyTorch, and the in-repo ByteTrack is ~250 lines of Kalman filtering and assignment.
boxmot = ["boxmot>=22.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_tracking"]

[tool.uv.sources]
sio-core = { workspace = true }
sio-schemas = { workspace = true }
