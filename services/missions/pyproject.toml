[project]
name = "sio-missions"
version = "0.1.0"
description = "SIO mission control: objectives, assignment, comms, replay (PRD M17)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = ["sio-core", "sio-schemas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_missions"]

[tool.uv.sources]
sio-core = { workspace = true }
sio-schemas = { workspace = true }
