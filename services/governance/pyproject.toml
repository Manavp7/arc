[project]
name = "sio-governance"
version = "0.1.0"
description = "SIO governance: the audit trail, policy visibility and posture (PRD M18/M19/M21)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = ["sio-core", "sio-schemas"]

[project.optional-dependencies]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_governance"]

[tool.uv.sources]
sio-core = { workspace = true }
sio-schemas = { workspace = true }
