[project]
name = "sio-api"
version = "0.1.0"
description = "SIO API: REST, GraphQL, SSE and media over the world model (PRD M22)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "sio-core",
    "sio-schemas",
    "strawberry-graphql[fastapi]>=0.250",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_api"]

[tool.uv.sources]
sio-core = { workspace = true }
sio-schemas = { workspace = true }
