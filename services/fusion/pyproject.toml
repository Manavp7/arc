[project]
name = "sio-fusion"
version = "0.1.0"
description = "SIO sensor fusion: N observations of one object become one entity (PRD M5)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "sio-core",
    "sio-schemas",
    "numpy>=2.0",
]

[project.optional-dependencies]
# The PRD names FilterPy. The constant-velocity position model is linear, so the filter here is a
# plain Kalman filter written in numpy (about fifteen lines); FilterPy remains available for the
# non-linear models a future scenario might need.
filterpy = ["filterpy>=1.4.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_fusion"]

[tool.uv.sources]
sio-core = { workspace = true }
sio-schemas = { workspace = true }
