[project]
name = "sio-simulation"
version = "0.1.0"
description = "SIO what-if simulation: counterfactual projections from the live world model (PRD M11)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = ["sio-core", "sio-schemas", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_simulation"]

[tool.uv.sources]
sio-core = { workspace = true }
sio-schemas = { workspace = true }
