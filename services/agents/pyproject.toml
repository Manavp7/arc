[project]
name = "sio-agents"
version = "0.1.0"
description = "SIO agents: scheduled loops that propose, with a human-on-the-loop gate (PRD M14)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "sio-core",
    "sio-schemas",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_agents"]

[tool.uv.sources]
sio-core = { workspace = true }
sio-schemas = { workspace = true }
