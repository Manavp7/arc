[project]
name = "sio-mcp"
version = "0.1.0"
description = "SIO MCP server: the copilot's tools exposed to external clients (Tier 4 #3)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "sio-core",
    "sio-schemas",
    "sio-copilot",
    "mcp>=1.9",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_mcp"]

[tool.uv.sources]
sio-core = { workspace = true }
sio-schemas = { workspace = true }
sio-copilot = { workspace = true }
