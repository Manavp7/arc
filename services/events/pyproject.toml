[project]
name = "sio-events"
version = "0.1.0"
description = "SIO event engine: declarative rule CEP plus anomaly detection (PRD M9, M22)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "sio-core",
    "sio-schemas",
    "pyyaml>=6.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
# PyOD's IsolationForest, for when the feature space grows enough that interaction effects matter.
# Not a default dependency: on the handful of rates this service produces, a forest is no better than a
# robust z-score and considerably worse at attributing its score to individual features.
anomaly = ["pyod>=2.0", "scikit-learn>=1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_events"]

[tool.uv.sources]
sio-core = { workspace = true }
sio-schemas = { workspace = true }
