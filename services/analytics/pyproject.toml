[project]
name = "sio-analytics"
version = "0.1.0"
description = "SIO analytics: KPIs, H3 heatmaps and reports from the append-only record (PRD M19)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = ["sio-core", "sio-schemas", "h3>=4.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_analytics"]

[tool.uv.sources]
sio-core = { workspace = true }
sio-schemas = { workspace = true }
