[project]
name = "sio-plugin-demo"
version = "0.1.0"
description = "Proof that a connector and a rule can be added to SIO without touching the core (PRD M22)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
# Deliberately depends only on the two public packages. If this needed anything from a SERVICE, the claim
# would be false — a plugin that has to import `sio_ingest` internals is a fork with extra steps.
dependencies = ["sio-core", "sio-schemas"]

# The entry points are the whole mechanism. Installing this package makes both extensions visible to a
# running platform with no edit to any file in `services/` or `libs/`.
[project.entry-points."sio.connectors"]
tide_gauge = "sio_plugin_demo.connector:TideGaugeConnector"

[project.entry-points."sio.rules"]
tide_flood_warning = "sio_plugin_demo.rules:tide_flood_warning"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_plugin_demo"]

# NO [tool.uv.sources] workspace refs, deliberately.
#
# This package is meant to install the way a third party's would: plain dependencies on the two public
# libraries, resolved from wherever they happen to be. Adding workspace sources would make it a member of this
# monorepo, and a plugin that only builds inside the repository it extends proves nothing about extensibility.
#
# In this checkout the libraries are already in the environment, so  is the
# equivalent of a real install with its dependencies already satisfied.
