[project]
name = "sio-core"
version = "0.1.0"
description = "SIO core runtime: ports, adapters, service base, telemetry, explanations"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "sio-schemas",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "structlog>=25.1",
    "prometheus-client>=0.21",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "redis>=5.2",
    "psycopg[binary,pool]>=3.2",
    "neo4j>=5.27",
    "minio>=7.2",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.12"]
qdrant = ["qdrant-client>=1.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_core"]

[tool.uv.sources]
sio-schemas = { workspace = true }
