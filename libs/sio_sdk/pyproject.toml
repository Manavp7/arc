[project]
name = "sio-sdk"
version = "0.1.0"
description = "Typed Python client for the Spatial Intelligence OS API (PRD M22)"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
# `sio-schemas` only, deliberately: the SDK returns the platform's own models, and depending on `sio-core`
# would drag adapters, a bus and a policy engine into a package whose job is to make HTTP requests.
dependencies = ["sio-schemas", "httpx>=0.27", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_sdk"]

[tool.uv.sources]
sio-schemas = { workspace = true }
