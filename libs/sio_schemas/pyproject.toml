[project]
name = "sio-schemas"
version = "0.1.0"
description = "SIO shared data contracts: the versioned envelopes every service speaks"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sio_schemas"]
