[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True
show_error_codes = True
pretty = True
exclude = (?x)(^\.sio/|^\.legacy/|^web/|^\.venv/)

# The shared libraries are the contract every service depends on: hold them to a
# stricter standard than the services themselves.
[mypy-sio_schemas.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-sio_core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-tests.*]
disallow_untyped_defs = False

# Third-party packages without bundled type information.
[mypy-filterpy.*]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-onnxruntime.*]
ignore_missing_imports = True

[mypy-h3.*]
ignore_missing_imports = True

[mypy-neo4j.*]
ignore_missing_imports = True

[mypy-minio.*]
ignore_missing_imports = True

[mypy-pgvector.*]
ignore_missing_imports = True

[mypy-statsforecast.*]
ignore_missing_imports = True

[mypy-pyod.*]
ignore_missing_imports = True

[mypy-river.*]
ignore_missing_imports = True

[mypy-ortools.*]
ignore_missing_imports = True

[mypy-simpy.*]
ignore_missing_imports = True

[mypy-mesa.*]
ignore_missing_imports = True

[mypy-bytewax.*]
ignore_missing_imports = True

[mypy-rapidocr.*]
ignore_missing_imports = True

[mypy-presidio_analyzer.*]
ignore_missing_imports = True

[mypy-presidio_anonymizer.*]
ignore_missing_imports = True

[mypy-langgraph.*]
ignore_missing_imports = True
